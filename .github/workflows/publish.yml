name: Publish JSON Schemas
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Publish
    permissions:
      contents: read
    steps:
      - name: Set-up s5cmd
        uses: peak/action-setup-s5cmd@main
        with:
          version: v2.3.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install dependencies
        run: pnpm install

      - name: Publish packages
        run: pnpm publish --provenance

      - name: Generate JSON Schemas
        run: pnpm generate

      - name: Upload schemas
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          s5cmd --endpoint-url ${{ vars.AWS_ENDPOINT_URL }} sync --delete 'public/v*' 's3://hackfed-schemas/'
